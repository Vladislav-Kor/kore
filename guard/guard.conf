# Настройки сторожа CPU. Правит пульт KORE, сторож перечитывает файл на ходу.
# Системные процессы защищены в коде сторожа: убрать их отсюда нельзя.
enabled=1
limit=75
min_cap=8
protect_foreground=1
exempt=brave,chrome,msedge,firefox,opera,vivaldi,browser,yandex
protected_paths=\steamapps\,\Riot Games\,\Epic Games\,\GOG Games\
