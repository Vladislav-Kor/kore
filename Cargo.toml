[package]
name = "kore"
version = "1.0.0"
edition = "2021"
description = "KORE: Korchagin Overload & Resource Engine. Пульт загрузки ПК для Windows: сторож CPU, графики, память"
repository = "https://github.com/Vladislav-Kor/kore"
license-file = "LICENSE"
publish = false

[dependencies]
# egui берём через eframe: один источник версии egui.
# Рисуем через wgpu на Direct3D 12: OpenGL-драйверы на части ПК зависают в wglMakeCurrent.
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
# eframe не включает бэкенды wgpu сам: без этой строки окно падает с FailedToCreateSurfaceForAnyBackend.
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }

# Встраивание иконки в .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Debug-сборка с лёгкой оптимизацией: анимация не тормозит, а сборка остаётся быстрой.
[profile.dev]
opt-level = 1
